<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="villavesa lab — interactive planning tool for Pamplona's urban bus network."
    />
    <title>villavesa lab</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // apply the theme before first paint (no flash)
      try {
        var p = JSON.parse(localStorage.getItem('vlab.prefs') || '{}').themePref || 'system';
        var d =
          p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
