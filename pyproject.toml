[project]
name = "villavesa-lab"
version = "0.1.0"
description = "Interactive planning tool for Pamplona's urban bus network"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "numba>=0.61",
  "scipy>=1.14",
  "pandas>=2.2",
  "pyarrow>=17",
  "shapely>=2.0",
  "pyproj>=3.6",
  "geopandas>=1.0",
  "pandera>=0.21",
  "contourpy>=1.3",
  "ortools>=9.11",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "orjson>=3.10",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7", "mypy>=1.13", "httpx>=0.27", "pandas-stubs", "scipy-stubs"]
data = ["osmium>=4.0", "requests>=2.32", "openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/src/vlab", "api/src/vlab_api"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "api/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["engine/src", "api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["engine/src/vlab"]
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
